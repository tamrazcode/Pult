name: Bug report
description: Something is broken or behaves differently than expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please do not include API keys, tokens or private transcripts.
  - type: input
    id: version
    attributes:
      label: Pult version
      placeholder: 0.1.0 (Help → About or the release tag)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, macOS 15.2, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect provider …
        2. Open a thread …
        3. Send …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the visible error and any relevant log lines. Remove secrets.
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Agent / provider
      placeholder: Claude Code, Codex, OpenCode, Gemini CLI, dsh, mock
