[package]
name = "pult-core"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/tamrazcode/Pult"
homepage = "https://github.com/tamrazcode/Pult"
description = "pult - local-first Agent Development Environment over ACP (Rust core)"

[lib]
name = "pult_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[dependencies]
similar = "2"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
rusqlite = { version = "0.42", features = ["bundled"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
toml = "1.2.1"
tauri-plugin-dialog = "2"
